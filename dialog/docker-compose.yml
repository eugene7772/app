services:
  citus-master:
    image: citusdata/citus:latest
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - citus_master_data:/var/lib/postgresql
      - ./docker/citus/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: citusdata/citus:latest
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  citus-bootstrap:
    image: citusdata/citus:latest
    depends_on:
      citus-master:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      WORKER_HOSTS: worker
    volumes:
      - ./docker/citus/bootstrap:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/01-bootstrap.sh"]
    restart: "no"

  dialog:
    build:
      context: ..
      dockerfile: dialog/Dockerfile
    container_name: dialog-service
    depends_on:
      citus-bootstrap:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://citus-master:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8083:8080"

volumes:
  citus_master_data:
